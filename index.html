let first=null,locked=false,matched=0,attempts=0,total=10,soundOn=true,turn=0,audio;const board=document.getElementById('board'),score=document.getElementById('score'),tries=document.getElementById('tries'),msg=document.getElementById('msg');function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function beep(ok){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=ok?[660,880]:[330,220];notes.forEach((hz,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.13;o.type=ok?'sine':'triangle';o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.start(t);o.stop(t+.18)})}catch(e){}}function update(){score.textContent=matched+'/'+total;tries.textContent=attempts}function layout(){let n=total*2,wide=innerWidth>=innerHeight,cols=wide?Math.ceil(Math.sqrt(n*2.0)):Math.ceil(Math.sqrt(n*.65));cols=Math.min(n,Math.max(2,cols));board.style.setProperty('--cols',cols);board.style.setProperty('--rows',Math.ceil(n/cols))}function start(){turn++;const current=turn;first=null;locked=false;matched=0;attempts=0;total=+document.getElementById('count').value;soundOn=document.getElementById('sound').value==='on';msg.textContent='Pronađi odgovarajuće parove';update();board.replaceChildren();layout();const cards=shuffle(shuffle([...pairs]).slice(0,total).flatMap((p,i)=>[{id:i,label:p[0]},{id:i,label:p[1]}]));cards.forEach((data,i)=>{let b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label','Zatvorena kartica '+(i+1));let face=document.createElement('span');face.className='face';face.textContent=data.label;b.append(face);b.onclick=()=>{if(locked||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');b.setAttribute('
